quarkus.http.port=8080
quarkus.http.host=0.0.0.0

# --- Base de datos (usuario propio, permisos mínimos) ---
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=${CIES_DB_USER:cies_quarkus}
quarkus.datasource.password=${CIES_DB_PASS:cies_quarkus123}
quarkus.datasource.jdbc.url=${CIES_DB_URL:jdbc:mysql://mysql:3306/clinica_cies?useUnicode=true&characterEncoding=utf8&serverTimezone=America/La_Paz}
quarkus.datasource.jdbc.max-size=10

# --- Correo (Mailpit en desarrollo) ---
quarkus.mailer.host=${CIES_SMTP_HOST:mailpit}
quarkus.mailer.port=${CIES_SMTP_PORT:1025}
quarkus.mailer.from=${CIES_MAIL_FROM:no-reply@cies.local}
quarkus.mailer.username=${CIES_SMTP_USER:}
quarkus.mailer.password=${CIES_SMTP_PASS:}
quarkus.mailer.start-tls=${CIES_SMTP_TLS:DISABLED}
quarkus.mailer.mock=false

# --- API key entre servicios ---
cies.api-key=${CIES_API_KEY:cies-dev-key-cambiar}
# --- Logs del sistema (carpeta compartida logs/) ---
quarkus.log.level=INFO
quarkus.log.file.enable=true
quarkus.log.file.path=${CIES_LOG_DIR:logs}/cies_quarkus.log
quarkus.log.file.format=%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.file.rotation.max-file-size=5M
quarkus.log.file.rotation.max-backup-index=5
quarkus.log.file.rotation.rotate-on-boot=true

# --- OTP ---
cies.otp.secret=${CIES_OTP_SECRET:cambiar-secreto-otp}
cies.otp.minutos=5
cies.otp.max-intentos=3