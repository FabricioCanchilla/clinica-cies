services:
  mysql:
    image: mysql:8.4
    container_name: clinica_cies_db
    restart: unless-stopped
    command: >
      --lower-case-table-names=1
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: clinica_cies
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/sql:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  app:
    build: ./docker
    container_name: clinica_cies_app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: clinica_cies
      DB_USERNAME: cies_app
      DB_PASSWORD: cies_app123
      COMPOSER_ALLOW_SUPERUSER: "1"
    ports:
      - "8001:8000"
    volumes:
      - .:/var/www/html
      - vendor_data:/var/www/html/vendor

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: clinica_cies_pma
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    ports:
      - "8081:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
  vendor_data: